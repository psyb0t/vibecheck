# Hardened self-hosted deployment floor for Vibecheck.
#
# `make audit-compose` renders this file and checks it against the shared
# production policy floor: dropped capabilities, no-new-privileges, read-only
# root filesystem, init, resource and PID ceilings, bounded logs, an explicit
# restart policy, a healthcheck, and loopback-only published ports.
#
# Set VIBECHECK_TYPESAFE_API_KEY and VIBECHECK_POLICY_HOST_DIR in a gitignored
# .env, then `docker compose up -d`. See docs/deployment.md.

services:
  vibecheck:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibecheck:local
    command: ["run"]

    # Loopback only. Put a reverse proxy or a tailnet edge in front of this
    # before anything outside the host can reach it. The container-side address
    # is 0.0.0.0 because the published port is what restricts exposure.
    ports:
      - "127.0.0.1:${VIBECHECK_HTTP_PUBLISH_PORT:-8080}:8080"

    environment:
      ENV: prod
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_ADD_SOURCE: ${LOG_ADD_SOURCE:-false}
      RUNNER_SHUTDOWNTIMEOUT: ${RUNNER_SHUTDOWNTIMEOUT:-10s}

      VIBECHECK_API_TOKEN: ${VIBECHECK_API_TOKEN:-}

      VIBECHECK_POLICY_DIR: /config/policies
      VIBECHECK_ALLOW_INLINE_POLICIES: ${VIBECHECK_ALLOW_INLINE_POLICIES:-false}

      VIBECHECK_TYPESAFE_BASE_URL: ${VIBECHECK_TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      VIBECHECK_TYPESAFE_API_KEY: ${VIBECHECK_TYPESAFE_API_KEY:?set VIBECHECK_TYPESAFE_API_KEY in .env}
      VIBECHECK_TYPESAFE_MODEL: ${VIBECHECK_TYPESAFE_MODEL:-jev-latest}

      VIBECHECK_DB_DRIVER: ${VIBECHECK_DB_DRIVER:-sqlite}
      VIBECHECK_DB_SQLITE_PATH: /data/vibecheck.sqlite

      VIBECHECK_STORE_INPUTS: ${VIBECHECK_STORE_INPUTS:-false}
      VIBECHECK_DATA_KEY: ${VIBECHECK_DATA_KEY:-}

    volumes:
      # Point VIBECHECK_POLICY_HOST_DIR at the directory holding your policy
      # YAML. Read-only: Vibecheck loads policies, it never writes them.
      - ${VIBECHECK_POLICY_HOST_DIR:-./policies}:/config/policies:ro
      - vibecheck-data:/data

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid

    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    init: true
    restart: unless-stopped

    # Compose normalises pids_limit into deploy.resources.limits.pids and
    # rejects the project if the two disagree, so both carry the same value.
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
          pids: 256

    # Readiness, not liveness. /ready reports that the database answers, which
    # is the condition under which this container can serve, so a
    # depends_on: service_healthy elsewhere means "can actually take traffic".
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

    networks:
      - vibecheck

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  vibecheck-data:

networks:
  vibecheck:
    driver: bridge
